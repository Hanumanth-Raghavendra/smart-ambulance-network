spring.application.name=smart-ambulance-network
server.port=${PORT:8080}

# ---- PostgreSQL (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_ambulance}}
spring.datasource.username=${DB_USER:sanet}
spring.datasource.password=${DB_PASSWORD:sanet123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Security ----
# CHANGE THIS in any real deployment (min 32 characters).
san.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
san.jwt.expiry-minutes=720
san.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Simulation ----
# 1 real second = N simulated seconds. Ambulances, signal cycles and ETAs all run on this clock.
# Use 1 when feeding real GPS from a device.
san.sim.speed-multiplier=${SIM_SPEED:6}
san.sim.tick-millis=500
san.sim.ambulance-kmph=55
san.sim.loading-real-seconds=3
san.sim.hospital-response-timeout-seconds=60

# ---- Algorithms ----
san.clearance.lead-time-seconds=30
san.clearance.max-hold-seconds=150
san.alert.ahead-meters=900
san.alert.lateral-meters=250
san.alert.cooldown-seconds=25
san.ranking.w-travel=1.0
san.ranking.w-speciality=15.0
san.ranking.w-beds=10.0
san.ranking.severity-multiplier.minor=0.7
san.ranking.severity-multiplier.serious=1.0
san.ranking.severity-multiplier.critical=1.5
san.service-area-max-meters=7000

logging.level.com.smartambulance=INFO

# Boot would otherwise print a random generated password; authentication is JWT-only (see SecurityConfig)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
